<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalog - Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@1.9.10"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            margin-bottom: 10px;
            color: #00d4ff;
        }
        
        .subtitle {
            color: #888;
            margin-bottom: 20px;
            font-size: 0.95em;
        }
        
        .catalog-footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #1f3b6e;
            color: #666;
            font-size: 0.9em;
        }
        
        .table-container {
            background: #16213e;
            border-radius: 12px;
            padding: 20px;
            overflow-x: auto;
        }
        
        .catalog-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .catalog-table thead th {
            background: #0f1b33;
            padding: 12px 8px;
            text-align: left;
            color: #00d4ff;
            font-size: 0.85em;
        }
        
        .catalog-table tbody td {
            padding: 12px 8px;
            border-bottom: 1px solid #1f3b6e;
        }
        
        .catalog-table tbody tr:last-child td {
            border-bottom: none;
        }
        
        .catalog-table tbody tr:hover {
            background: #1f2b4d;
        }
        
        .empty-state {
            background: #16213e;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            color: #888;
        }
        
        .empty-state p {
            margin-bottom: 10px;
        }
        
        /* Timeline styles */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .timeline-event {
            display: flex;
            gap: 15px;
        }
        
        .timeline-event.benchmark .event-type {
            color: #00d4ff;
        }
        
        .timeline-event.session .event-type {
            color: #00ff88;
        }
        
        .event-type {
            font-size: 1.5em;
            min-width: 40px;
            text-align: center;
        }
        
        .event-details {
            flex: 1;
            background: #16213e;
            border-radius: 12px;
            padding: 15px 20px;
        }
        
        .event-header {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .event-model {
            font-weight: bold;
            font-size: 1em;
        }
        
        .event-server {
            color: #666;
            font-size: 0.9em;
        }
        
        .event-workload {
            background: #0f1b33;
            color: #00d4ff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8em;
        }
        
        .event-custom {
            background: #4a1a1a;
            color: #ff6b6b;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8em;
        }
        
        .event-content {
            margin-bottom: 8px;
        }
        
        .event-details-text {
            color: #eee;
            font-size: 0.95em;
        }
        
        .event-memory {
            color: #888;
            font-size: 0.85em;
            margin-top: 4px;
        }
        
        .event-timestamp {
            color: #666;
            font-size: 0.8em;
        }
        
        /* Timeline event links */
        .timeline-event-link {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
        }
        
        .timeline-event {
            position: relative;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: #16213e;
            border-radius: 12px;
            padding: 15px 20px;
        }
        
        .stat-card h3 {
            color: #00d4ff;
            font-size: 0.9em;
            margin-bottom: 5px;
        }
        
        .stat-card .stat-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #00ff88;
        }
    </style>
</head>
<body>
    <div class="container">
        {% include '_nav.html' %}
        
        {% block content %}{% endblock %}
    </div>
</body>
</html>
