[project]
name = "monitor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "jinja2>=3.1.0",
    "pydantic>=2.10.0",
    "psutil>=6.1.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
monitor = "monitor.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# Any test hanging longer than this fails instead of blocking the suite/agent.
timeout = 60
timeout_method = "signal"

[tool.hatch.build.targets.wheel]
packages = ["monitor"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "aiohttp>=3.9.0",
    "pytest-timeout>=2.4.0",
]
